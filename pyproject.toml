[project]
name = "logbook"
version = "0.1.0"
description = "개인 개발자를 위한 업무 기록·공수 집계·주간업무보고서 생성 도구"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "pyperclip>=1.9",
  "rich>=13",
  "sqlalchemy>=2.1",
  "tomli-w>=1.0",
  "typer>=0.16",
  "tzdata",
]

[project.scripts]
lb = "logbook.cli.main:run"

[dependency-groups]
dev = [
  "mypy>=2.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "types-pyperclip",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logbook"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/logbook/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=logbook --cov-report=term-missing"
markers = ["subprocess: 새 인터프리터나 설치된 lb 실행 파일을 띄우는 테스트 (lb는 uv sync 필요)"]
