        <tr id="log-{{ row.id }}">
          <td class="num">{{ row.id }}</td>
          <td class="nowrap">{{ row.day }}</td>
          <td class="nowrap">{{ row.project }}</td>
          <td class="nowrap">{{ row.category }}</td>
          <td class="num nowrap">{{ row.duration }}</td>
          <td class="grid__note">{{ row.note }}</td>
          <td class="nowrap">{{ row.task }}</td>
          <td class="nowrap grid__actions">
            <button type="button" class="btn btn--small" hx-get="/logs/{{ row.id }}/edit" hx-target="closest tr" hx-swap="outerHTML">수정</button>
            <button type="button" class="btn btn--small btn--danger" hx-delete="/logs/{{ row.id }}" hx-vals='{{ {"version": row.version}|tojson }}' hx-include="#log-filters" hx-target="#log-table" hx-swap="outerHTML" hx-sync="this:drop" hx-disabled-elt="this" hx-confirm="{{ row.confirm }}">삭제</button>
          </td>
        </tr>
